# Nexsiz example configuration
# Lines starting with # are comments.

host=127.0.0.1
port=21
protocol=tcp
model=ftp
timeout_ms=400
max_reuse_messages=24

# Plugin selection
# model / protocol_model : ftp | smtp | http | generic
# integrity              : default | null
# oracle                 : default | strict | crash | hang | coverage
# encryptor              : null
integrity=default
oracle=default
encryptor=null

workers=4
connection_reuse=true

seed_dir=seeds/ftp
output_dir=output/ftp
verbose=true

# Optional limits
# max_execs=100000
# rng_seed=42
# target_cmd=python3 -m http.server 8080
