id = "crash/auth-escalation"
name = "auth-escalation"
version = "1.0.0"
categories = ["crash", "intrusive"]
events = ["crash"]
description = "Protocol-aware post-anomaly privilege and command escalation probe (FTP/SMTP/HTTP). After a crash or interesting event, attempts sequences that normally require higher privilege or authenticated elevated state: FTP SITE/RETR sensitive paths/CWD traversal, SMTP VRFY/EXPN/MAIL escalation, HTTP privileged paths/methods/Basic auth. Exit 2 when an unauthorized-looking successful transition or elevated response is observed. Intrusive. Distinct from auth-bypass."
language = "rust"
entry = "bin/nxs-auth-escalation"

[args]
# no script-specific required args
