categories = ["crash", "safe", "default"]
events = ["crash", "hang"]
description = "Copy crash (± minimised) into a stable archive under --out and optionally invoke NXS_NOTIFY_CMD. Safe, side-effect free beyond local filesystem and the optional hook."
language = "rust"
entry = "bin/nxs-save-notify"

