[package]
name = "nexsiz"
version = "0.1.0"
edition = "2021"
authors = ["Revana"]
description = "Stateful network protocol fuzzer in pure Rust — semantic mutation, integrity repair, grey-box coverage, snapshot/desocket, NXS post-crash actors"
license = "Apache-2.0"
readme = "README.md"
keywords = [
    "fuzzer",
    "network",
    "protocol",
    "stateful",
    "fuzzing",
]
categories = [
    "development-tools",
    "network-programming",
    "command-line-utilities",
]
repository = "https://github.com/revanakit/nexsiz"
homepage = "https://revanakit.github.io/nexsiz-blogs/"
documentation = "https://github.com/revanakit/nexsiz"

[[bin]]
name = "nexsiz"
path = "src/main.rs"

[lib]
name = "nexsiz"
path = "src/lib.rs"

[features]
default = []
libafl = ["dep:libafl", "dep:libafl_bolts", "dep:serde"]
# Operator-defined protocol models via JSON (field trees without recompile)
json-model = ["dep:serde", "dep:serde_json"]
# CRIU-based process snapshot / restore (requires criu binary on PATH)
criu = []

[dependencies]
# LibAFL 0.15 path (optional). serdeany_autoreg is required so that
# Serialize/Deserialize observers (ResponseStateObserver) and StdState
# populate the type registry; otherwise -L panics at startup with
# "Empty types registry".
libafl = { version = "0.15.4", optional = true, default-features = false, features = ["std"] }
libafl_bolts = { version = "0.15.4", optional = true, default-features = false, features = ["std", "serdeany_autoreg"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

# POSIX SHM (shm_open/mmap) + setsid() — Linux / Unix only.
# Windows path uses pure kernel32 File Mapping (no libc).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true

[profile.dev]
opt-level = 1
